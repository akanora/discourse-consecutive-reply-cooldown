cooldown_enabled:
  type: bool
  default: true

cooldown_duration:
  type: integer
  default: 60
  min: 1
  max: 525600

cooldown_unit:
  type: enum
  default: minutes
  choices:
    - minutes
    - hours

exempt_staff:
  type: bool
  default: true

include_private_messages:
  type: bool
  default: false

texts:
  type: objects
  default:
    - key: warning_title
      text: "Please wait before replying again"
      translations:
        - locale: tr_TR
          text: "Tekrar yanıt vermeden önce lütfen bekleyin"
    - key: warning_message
      text: "You wrote the last post in this topic. You can post again in %{time_left}, or as soon as someone else replies."
      translations:
        - locale: tr_TR
          text: "Bu konudaki son mesajı siz yazdınız. %{time_left} sonra ya da başka bir kullanıcı yanıt verdiğinde yeniden mesaj yazabilirsiniz."
    - key: minutes_one
      text: "%{count} minute"
      translations:
        - locale: tr_TR
          text: "%{count} dakika"
    - key: minutes_other
      text: "%{count} minutes"
      translations:
        - locale: tr_TR
          text: "%{count} dakika"
    - key: hours_one
      text: "%{count} hour"
      translations:
        - locale: tr_TR
          text: "%{count} saat"
    - key: hours_other
      text: "%{count} hours"
      translations:
        - locale: tr_TR
          text: "%{count} saat"
    - key: hours_and_minutes
      text: "%{hours} %{minutes}"
      translations: []
  schema:
    name: text
    identifier: key
    properties:
      key:
        type: enum
        required: true
        choices:
          - warning_title
          - warning_message
          - minutes_one
          - minutes_other
          - hours_one
          - hours_other
          - hours_and_minutes
      text:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 1000
      translations:
        type: objects
        schema:
          name: translation
          identifier: locale
          properties:
            locale:
              type: enum
              required: true
              choices:
                - ar
                - be
                - bg
                - bs_BA
                - ca
                - cs
                - da
                - de
                - el
                - en
                - en_GB
                - es
                - et
                - fa_IR
                - fi
                - fr
                - gl
                - he
                - hr
                - hu
                - hy
                - id
                - it
                - ja
                - ko
                - lt
                - lv
                - nb_NO
                - nl
                - pl_PL
                - pt
                - pt_BR
                - ro
                - ru
                - sk
                - sl
                - sq
                - sr
                - sv
                - sw
                - te
                - th
                - tr_TR
                - ug
                - uk
                - ur
                - vi
                - zh_CN
                - zh_TW
            text:
              type: string
              validations:
                max_length: 1000
